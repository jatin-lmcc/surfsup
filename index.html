<!DOCTYPE html>
<html>
<head>
<title>Black Sand Surf School</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<h1>🌊 Wave Check </h1>

<div class="spot-selector">

<label>Select Surf Spot</label>

<select id="spotSelect">
<option value="">Choose a location</option>
</select>

</div>



<div class="location-box">

<input id="lat" placeholder="Latitude">
<input id="lon" placeholder="Longitude">

<button onclick="loadSpot()">Load Spot</button>

</div>

<div class="dashboard">

<div class="card">
<h3>Today</h3>
<div>Wave Height: <span id="t-wave"></span></div>
<div>Surf Rating: <span id="t-rating"></span></div>
</div>

<div class="card">
<h3>Tomorrow</h3>
<div>Wave Height: <span id="tm-wave"></span></div>
<div>Surf Rating: <span id="tm-rating"></span></div>
</div>

<div class="card">
<h3>Day After</h3>
<div>Wave Height: <span id="da-wave"></span></div>
<div>Surf Rating: <span id="da-rating"></span></div>
</div>

</div>

<footer class="footer">
<div id="version"></div>
<div class="made">
Made with ❤️ from India 
</div>
</footer>

<script src="surf.js"></script>

</body>
</html>
