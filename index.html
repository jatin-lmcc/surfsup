<!DOCTYPE html>
<html>
<head>
<title>Black Sand Surf School</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🌊 Wave Check for Black Sand Surf School</h1>

<div class="dashboard">

<div class="card">
<div class="label">Wave Height</div>
<div id="wave" class="value">Loading...</div>
</div>

<div class="card">
<div class="label">Surf Rating</div>
<div id="rating" class="rating">Loading...</div>
</div>

</div>

<div id="updated" class="updated"></div>

<h2>Where will I be surfing?</h2>

<div class="map-container">

<iframe
width="100%"
height="320"
style="border:0;border-radius:12px"
loading="lazy"
allowfullscreen
referrerpolicy="no-referrer-when-downgrade"
src="https://maps.google.com/maps?q=19.449187,72.748365&z=16&t=k&output=embed">
</iframe>

</div>

<footer class="footer">
<div id="version"></div>
<div class="made">
Made with ❤️ from India 
</div>
</footer>

<div class="dashboard">

<div class="card">
<div class="label">Yesterday</div>
<div id="yesterday" class="value">Loading...</div>
</div>

<div class="card">
<div class="label">Today</div>
<div id="today" class="value">Loading...</div>
</div>

<div class="card">
<div class="label">Tomorrow</div>
<div id="tomorrow" class="value">Loading...</div>
</div>

</div>

<script src="surf.js"></script>

</body>
</html>
