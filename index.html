<!DOCTYPE html>
<html>
<head>
<title>Black Sand Surf School</title>

<style>

body{
font-family:Arial, sans-serif;
background:#0b1e2d;
color:white;
text-align:center;
margin:0;
padding:40px;
}

h1{
margin-bottom:30px;
}

.dashboard{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

.card{
background:#163a59;
padding:25px;
border-radius:12px;
width:220px;
box-shadow:0 6px 15px rgba(0,0,0,0.3);
}

.label{
font-size:14px;
opacity:0.8;
}

.value{
font-size:40px;
margin-top:10px;
font-weight:bold;
}

.rating{
font-size:36px;
margin-top:10px;
}

.updated{
margin-top:30px;
font-size:13px;
opacity:0.7;
}

</style>
</head>

<body>

<h1>🌊 Wave Check for Black Sand Surf School</h1>

<div class="dashboard">

<div class="card">
<div class="label">Wave Height</div>
<div id="wave" class="value">Loading...</div>
</div>

<div class="card">
<div class="label">Surf Rating</div>
<div id="rating" class="rating">Loading...</div>
</div>

</div>

<div id="updated" class="updated"></div>

<script>

async function loadSurf(){

try{

const url="https://marine-api.open-meteo.com/v1/marine?latitude=19.45&longitude=72.75&current=wave_height";

const res=await fetch(url);
const data=await res.json();

const wave=data.current.wave_height;

document.getElementById("wave").innerText=wave+" m";

let score=0;

if(wave>1.2) score=4;
else if(wave>0.9) score=3;
else if(wave>0.6) score=2;
else score=1;

let rating="⭐ Poor";

if(score==4) rating="⭐⭐⭐⭐ Epic";
else if(score==3) rating="⭐⭐⭐ Good";
else if(score==2) rating="⭐⭐ Okay";

document.getElementById("rating").innerText=rating;

const now=new Date();

document.getElementById("updated").innerText=
"Last updated: "+now.toLocaleString();

}catch(e){

document.getElementById("rating").innerText="Error loading data";

}

}

loadSurf();

</script>

</body>
</html>
