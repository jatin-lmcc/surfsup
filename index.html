<!DOCTYPE html>
<html>
<head>
<title>Arnala Surf Dashboard</title>

<style>
body{
font-family:Arial;
background:#0c1b2a;
color:white;
text-align:center;
padding:40px;
}

.card{
background:#132f4c;
padding:20px;
margin:20px auto;
border-radius:10px;
width:250px;
}

.big{
font-size:36px;
margin-top:10px;
}
</style>
</head>

<body>

<h1>🌊 Arnala Surf Dashboard</h1>

<div class="card">
Wave Height
<div id="wave" class="big">Loading...</div>
</div>

<div class="card">
Wind Speed
<div id="wind" class="big">Loading...</div>
</div>

<div class="card">
Surf Rating
<div id="rating" class="big">Loading...</div>
</div>

<script>

async function loadSurf(){

try{

const url="https://marine-api.open-meteo.com/v1/marine?latitude=19.45&longitude=72.75&current=wave_height,wind_speed_10m";

const res=await fetch(url);
const data=await res.json();

const wave=data.current.wave_height;
const wind=data.current.wind_speed_10m;

document.getElementById("wave").innerText=wave+" m";
document.getElementById("wind").innerText=wind+" km/h";

let score=0;

if(wave>0.8) score+=3;
if(wind<12) score+=3;

let rating="Skip";

if(score>=6) rating="⭐⭐⭐ Good";
else if(score>=3) rating="⭐⭐ Okay";

document.getElementById("rating").innerText=rating;

}catch(e){

document.body.innerHTML+="<p>API Error loading data</p>";

}

}

window.onload=loadSurf;

</script>

</body>
</html>
